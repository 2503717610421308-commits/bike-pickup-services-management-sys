{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card bc-card">
        <div class="card-body p-4">
          <h3 class="mb-1">Log in</h3>
          <p class="text-muted">Access your bike service account.</p>
          {% if error %}<div class="alert alert-danger"><i class="bi bi-exclamation-triangle"></i> {{ error }}</div>{% endif %}
          <form method="post" class="needs-validation" novalidate>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required>
              <div class="invalid-feedback">Enter a valid email address.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
              <div class="invalid-feedback">Password is required.</div>
            </div>
            <button class="btn btn-accent w-100" type="submit">Login</button>
          </form>
          <p class="text-center mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
